<div style="display: flex; justify-content: space-between; margin-top: 2em; padding: 1em 0;">
    <div>
        {% if page.previous %}
        <a href="{{ page.previous.url }}" class="btn btn--primary" title="{{ page.previous.title | escape }}" aria-label="Previous Post: {{ page.previous.title | escape }}">← Previous Post</a>
        {% endif %}
    </div>
    <div>
        {% if page.next %}
        <a href="{{ page.next.url }}" class="btn btn--primary" title="{{ page.next.title | escape }}" aria-label="Next Post: {{ page.next.title | escape }}">Next Post →</a>
        {% endif %}
    </div>
</div>
